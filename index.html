<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procyon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f6f7;
    --bg-sidebar:#ececef;
    --bg-surface:#ffffff;
    --bg-hover:#e4e4e8;
    --border:#e1e1e5;
    --text:#1c1c1f;
    --text-muted:#6b6b72;
    --text-faint:#9c9ca3;
    --accent:#2c2c30;
    --accent-contrast:#ffffff;
    --danger:#b3432f;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow:0 1px 2px rgba(20,20,25,.04), 0 8px 24px rgba(20,20,25,.06);
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg:#1b1b1e;
    --bg-sidebar:#202024;
    --bg-surface:#28282c;
    --bg-hover:#323236;
    --border:#37373c;
    --text:#f1f1f2;
    --text-muted:#a2a2a8;
    --text-faint:#6f6f76;
    --accent:#f1f1f2;
    --accent-contrast:#1b1b1e;
    --danger:#e08a76;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer;}
  textarea{font-family:inherit;}
  ::selection{background:rgba(140,140,160,.35);}

  /* thin scrollbars */
  *{scrollbar-width:thin; scrollbar-color: var(--border) transparent;}
  *::-webkit-scrollbar{width:8px; height:8px;}
  *::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
  *::-webkit-scrollbar-track{background:transparent;}

  a:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible{
    outline:2px solid var(--text-muted);
    outline-offset:2px;
  }

  .app{display:flex; height:100vh; width:100vw; position:relative;}

  /* ---------- Star mark (Procyon signature) ---------- */
  .star{
    display:inline-block;
    color:var(--accent);
  }
  .star svg{display:block;}
  @keyframes starPulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(.78); opacity:.55; }
  }
  @keyframes starSpin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }
  .star.thinking svg{ animation: starPulse 1.1s ease-in-out infinite; }
  .star.idle-anim svg{ animation: starSpin 18s linear infinite; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:264px;
    flex-shrink:0;
    background:var(--bg-sidebar);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    height:100%;
    transition:transform .25s ease, width .25s ease;
    z-index:40;
  }
  .sidebar-header{
    display:flex; align-items:center; gap:10px;
    padding:18px 16px 14px 18px;
  }
  .brand{display:flex; align-items:center; gap:10px; flex:1; min-width:0;}
  .brand-name{font-weight:600; font-size:15px; letter-spacing:.2px;}
  .sidebar-collapse{
    background:none; border:none; color:var(--text-muted);
    width:28px; height:28px; border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center;
  }
  .sidebar-collapse:hover{background:var(--bg-hover);}

  .new-chat-btn{
    margin:2px 14px 12px 14px;
    display:flex; align-items:center; gap:8px;
    background:var(--bg-surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 12px;
    border-radius:var(--radius-md);
    font-size:13.5px; font-weight:500;
    box-shadow:var(--shadow);
  }
  .new-chat-btn:hover{background:var(--bg-hover);}

  .sidebar-search{
    margin:0 14px 10px 14px;
    display:flex; align-items:center; gap:8px;
    background:transparent;
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:7px 10px;
  }
  .sidebar-search svg{flex-shrink:0; color:var(--text-faint);}
  .sidebar-search input{
    border:none; background:transparent; outline:none;
    font-size:13px; color:var(--text); width:100%;
  }
  .sidebar-search input::placeholder{color:var(--text-faint);}

  .sidebar-label{
    padding:10px 18px 4px 18px;
    font-size:11px; font-weight:600; letter-spacing:.4px;
    color:var(--text-faint); text-transform:uppercase;
  }

  .session-list{flex:1; overflow-y:auto; padding:0 10px 10px 10px;}
  .session-item{
    position:relative;
    display:flex; align-items:center;
    gap:8px;
    padding:9px 10px;
    border-radius:var(--radius-sm);
    font-size:13.5px;
    color:var(--text);
    cursor:pointer;
    white-space:nowrap; overflow:hidden;
  }
  .session-item span.title{overflow:hidden; text-overflow:ellipsis; flex:1;}
  .session-item:hover{background:var(--bg-hover);}
  .session-item.active{background:var(--bg-hover); font-weight:500;}
  .session-delete{
    display:none;
    background:none; border:none; color:var(--text-faint);
    width:22px; height:22px; border-radius:6px;
    align-items:center; justify-content:center; flex-shrink:0;
  }
  .session-item:hover .session-delete{display:flex;}
  .session-delete:hover{color:var(--danger); background:rgba(179,67,47,.1);}
  .session-empty{padding:14px 18px; font-size:12.5px; color:var(--text-faint);}

  .sidebar-footer{
    border-top:1px solid var(--border);
    padding:10px 14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .icon-btn{
    background:none; border:none; color:var(--text-muted);
    width:32px; height:32px; border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{background:var(--bg-hover); color:var(--text);}
  .footer-hint{font-size:11.5px; color:var(--text-faint);}

  .sidebar-backdrop{
    display:none;
    position:fixed; inset:0; background:rgba(0,0,0,.35);
    z-index:35;
  }

  /* ---------- Main ---------- */
  .main{flex:1; display:flex; flex-direction:column; min-width:0; height:100%;}
  .topbar{
    height:54px; flex-shrink:0;
    display:flex; align-items:center; gap:10px;
    padding:0 16px;
    border-bottom:1px solid transparent;
  }
  .hamburger{display:none;}
  .topbar-title{font-size:13.5px; color:var(--text-muted); font-weight:500;}
  .topbar-spacer{flex:1;}
  .status-dot{
    width:6px; height:6px; border-radius:50%;
    background:#6ea86e; display:inline-block; margin-right:6px;
  }

  .chat-scroll{
    flex:1; overflow-y:auto;
    display:flex; flex-direction:column; align-items:center;
  }
  .chat-inner{width:100%; max-width:720px; padding:8px 20px 40px 20px;}

  /* empty state */
  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    min-height:calc(100vh - 220px);
    padding:0 16px;
  }
  .empty-state .star{margin-bottom:18px;}
  .empty-title{font-size:26px; font-weight:600; letter-spacing:-.3px; margin-bottom:6px;}
  .empty-sub{font-size:14.5px; color:var(--text-muted); margin-bottom:26px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:520px;}
  .chip{
    background:var(--bg-surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 14px;
    border-radius:999px;
    font-size:13px;
  }
  .chip:hover{background:var(--bg-hover);}

  /* messages */
  .msg{margin:18px 0; animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .msg.user{display:flex; justify-content:flex-end;}
  .msg.user .bubble{
    background:var(--bg-surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:10px 16px;
    max-width:75%;
    font-size:14.5px;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
  }

  .msg.assistant{display:flex; gap:12px; align-items:flex-start;}
  .msg.assistant .avatar{
    flex-shrink:0; width:26px; height:26px;
    border-radius:50%;
    background:var(--bg-surface);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    margin-top:2px;
  }
  .msg.assistant .avatar svg{width:13px; height:13px;}
  .msg.assistant .content{
    flex:1; min-width:0;
    font-size:14.5px; line-height:1.65;
  }
  .msg.assistant .content p{margin:0 0 10px 0;}
  .msg.assistant .content p:last-child{margin-bottom:0;}
  .msg.assistant .content code{
    font-family:'JetBrains Mono', monospace;
    background:var(--bg-hover);
    padding:1px 5px; border-radius:4px; font-size:.88em;
  }
  .msg.assistant .content pre{
    background:var(--bg-surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:12px 14px;
    overflow-x:auto;
    margin:10px 0;
  }
  .msg.assistant .content pre code{background:none; padding:0; font-size:13px;}
  .msg.assistant .content strong{font-weight:600;}

  .msg-actions{
    display:flex; gap:2px; margin-top:6px;
    opacity:0; transition:opacity .15s ease;
  }
  .msg.assistant:hover .msg-actions{opacity:1;}
  .msg-actions button{
    background:none; border:none; color:var(--text-faint);
    width:26px; height:26px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
  }
  .msg-actions button:hover{background:var(--bg-hover); color:var(--text);}

  .typing .content{display:flex; align-items:center; gap:4px; height:20px;}
  .typing-dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--text-faint);
    animation:typingBounce 1.2s infinite ease-in-out;
  }
  .typing-dot:nth-child(2){animation-delay:.15s;}
  .typing-dot:nth-child(3){animation-delay:.3s;}
  @keyframes typingBounce{
    0%,60%,100%{ transform:translateY(0); opacity:.5; }
    30%{ transform:translateY(-4px); opacity:1; }
  }

  /* composer */
  .composer-wrap{
    display:flex; justify-content:center;
    padding:0 20px 18px 20px;
    flex-shrink:0;
  }
  .composer{
    width:100%; max-width:720px;
    background:var(--bg-surface);
    border:1px solid var(--border);
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:10px 10px 10px 18px;
    display:flex; align-items:flex-end; gap:8px;
  }
  .composer textarea{
    flex:1; border:none; outline:none; background:transparent;
    resize:none; color:var(--text);
    font-size:14.5px; line-height:1.5;
    max-height:200px; padding:6px 0;
  }
  .composer textarea::placeholder{color:var(--text-faint);}
  .send-btn{
    flex-shrink:0;
    width:34px; height:34px; border-radius:50%;
    background:var(--accent); color:var(--accent-contrast);
    border:none;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .15s ease, transform .1s ease;
  }
  .send-btn:disabled{opacity:.35; cursor:default;}
  .send-btn:not(:disabled):hover{transform:scale(1.05);}
  .composer-hint{
    text-align:center; font-size:11.5px; color:var(--text-faint);
    margin-top:9px;
  }

  /* toast */
  .toast{
    position:fixed; bottom:22px; left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--accent); color:var(--accent-contrast);
    padding:9px 16px; border-radius:999px;
    font-size:13px; font-weight:500;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:100;
    box-shadow:var(--shadow);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* responsive */
  @media (max-width:820px){
    .sidebar{
      position:fixed; top:0; left:0; bottom:0;
      transform:translateX(-100%);
      width:280px;
    }
    .sidebar.open{transform:translateX(0);}
    .sidebar-backdrop.show{display:block;}
    .hamburger{
      display:flex; background:none; border:none; color:var(--text);
      width:32px; height:32px; border-radius:var(--radius-sm);
      align-items:center; justify-content:center;
    }
    .hamburger:hover{background:var(--bg-hover);}
    .msg.user .bubble{max-width:88%;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

<div class="app">

  <div class="sidebar-backdrop" id="backdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <span class="star idle-anim" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L14.2 9.8 L22 12 L14.2 14.2 L12 22 L9.8 14.2 L2 12 L9.8 9.8 Z"/></svg>
        </span>
        <span class="brand-name">Procyon</span>
      </div>
      <button class="sidebar-collapse hamburger" id="closeSidebar" aria-label="Tutup sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Chat baru
    </button>

    <div class="sidebar-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Cari percakapan...">
    </div>

    <div class="sidebar-label">Riwayat</div>
    <div class="session-list" id="sessionList"></div>

    <div class="sidebar-footer">
      <span class="footer-hint">Tema</span>
      <button class="icon-btn" id="themeToggle" aria-label="Ganti tema"></button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="openSidebar" aria-label="Buka sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="topbar-title"><span class="status-dot"></span>Procyon</span>
      <div class="topbar-spacer"></div>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner">
        <!-- messages / empty state injected here -->
      </div>
    </div>

    <div class="composer-wrap">
      <div style="width:100%; max-width:720px;">
        <div class="composer">
          <textarea id="composerInput" rows="1" placeholder="Tanyakan apa saja ke Procyon..."></textarea>
          <button class="send-btn" id="sendBtn" disabled aria-label="Kirim">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <div class="composer-hint">Procyon bisa saja membuat kesalahan. Periksa info penting.</div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ============ ICONS ============ */
  const ICON = {
    star: '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L14.2 9.8 L22 12 L14.2 14.2 L12 22 L9.8 14.2 L2 12 L9.8 9.8 Z"/></svg>',
    copy: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
    check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    refresh: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6M3 22v-6h6M3.5 8a8.5 8.5 0 0 1 14.6-4.2M20.5 16a8.5 8.5 0 0 1-14.6 4.2"/></svg>',
    trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>',
    sun: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>'
  };

  const PROMPT_CHIPS = [
    "Jelaskan sebuah konsep ke aku",
    "Bantu aku brainstorming ide",
    "Ringkas teks yang panjang",
    "Bantu aku ngoding sesuatu"
  ];

  /* ============ STATE ============ */
  let sessions = loadSessions();
  let currentId = localStorage.getItem('procyon_current') || (sessions[0] && sessions[0].id) || null;

  function loadSessions(){
    try{ return JSON.parse(localStorage.getItem('procyon_sessions')) || []; }
    catch(e){ return []; }
  }
  function saveSessions(){
    localStorage.setItem('procyon_sessions', JSON.stringify(sessions));
    if(currentId) localStorage.setItem('procyon_current', currentId);
  }
  function getCurrentSession(){
    return sessions.find(s => s.id === currentId) || null;
  }
  function makeId(){ return 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }

  /* ============ DOM REFS ============ */
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('backdrop');
  const sessionListEl = document.getElementById('sessionList');
  const chatInner = document.getElementById('chatInner');
  const chatScroll = document.getElementById('chatScroll');
  const composerInput = document.getElementById('composerInput');
  const sendBtn = document.getElementById('sendBtn');
  const searchInput = document.getElementById('searchInput');
  const toastEl = document.getElementById('toast');
  const themeToggle = document.getElementById('themeToggle');

  /* ============ THEME ============ */
  function applyTheme(t){
    document.documentElement.dataset.theme = t;
    themeToggle.innerHTML = t === 'dark' ? ICON.sun : ICON.moon;
    localStorage.setItem('procyon_theme', t);
  }
  applyTheme(localStorage.getItem('procyon_theme') || 'light');
  themeToggle.addEventListener('click', () => {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });

  /* ============ SIDEBAR (mobile) ============ */
  document.getElementById('openSidebar').addEventListener('click', () => {
    sidebar.classList.add('open'); backdrop.classList.add('show');
  });
  document.getElementById('closeSidebar').addEventListener('click', closeMobileSidebar);
  backdrop.addEventListener('click', closeMobileSidebar);
  function closeMobileSidebar(){
    sidebar.classList.remove('open'); backdrop.classList.remove('show');
  }

  /* ============ SESSION LIST ============ */
  function renderSessionList(filter){
    const q = (filter||'').trim().toLowerCase();
    const filtered = sessions
      .slice()
      .sort((a,b) => b.updatedAt - a.updatedAt)
      .filter(s => !q || s.title.toLowerCase().includes(q));

    if(filtered.length === 0){
      sessionListEl.innerHTML = '<div class="session-empty">Belum ada percakapan.</div>';
      return;
    }
    sessionListEl.innerHTML = filtered.map(s => `
      <div class="session-item ${s.id === currentId ? 'active' : ''}" data-id="${s.id}">
        <span class="title">${escapeHtml(s.title)}</span>
        <button class="session-delete" data-del="${s.id}" aria-label="Hapus percakapan">${ICON.trash}</button>
      </div>
    `).join('');
  }

  sessionListEl.addEventListener('click', (e) => {
    const delBtn = e.target.closest('[data-del]');
    if(delBtn){
      e.stopPropagation();
      deleteSession(delBtn.dataset.del);
      return;
    }
    const item = e.target.closest('.session-item');
    if(item){ switchSession(item.dataset.id); closeMobileSidebar(); }
  });

  searchInput.addEventListener('input', () => renderSessionList(searchInput.value));

  function switchSession(id){
    currentId = id;
    saveSessions();
    renderSessionList(searchInput.value);
    renderMessages();
  }

  function deleteSession(id){
    sessions = sessions.filter(s => s.id !== id);
    if(currentId === id){
      currentId = sessions[0] ? sessions[0].id : null;
    }
    saveSessions();
    renderSessionList(searchInput.value);
    renderMessages();
    showToast('Percakapan dihapus');
  }

  document.getElementById('newChatBtn').addEventListener('click', () => {
    currentId = null;
    saveSessions();
    renderSessionList(searchInput.value);
    renderMessages();
    composerInput.focus();
    closeMobileSidebar();
  });

  /* ============ MESSAGE RENDERING ============ */
  function renderMessages(){
    const session = getCurrentSession();
    if(!session || session.messages.length === 0){
      chatInner.innerHTML = `
        <div class="empty-state">
          <span class="star idle-anim">${ICON_STAR_LG()}</span>
          <div class="empty-title">Halo, aku Procyon</div>
          <div class="empty-sub">Ada yang bisa kubantu hari ini?</div>
          <div class="chip-row">
            ${PROMPT_CHIPS.map(c => `<button class="chip" data-chip="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}
          </div>
        </div>`;
      chatInner.querySelectorAll('[data-chip]').forEach(btn => {
        btn.addEventListener('click', () => {
          composerInput.value = btn.dataset.chip;
          autoResize();
          composerInput.focus();
          toggleSendState();
        });
      });
      return;
    }

    chatInner.innerHTML = session.messages.map((m, idx) => {
      if(m.role === 'user'){
        return `<div class="msg user"><div class="bubble">${escapeHtml(m.content)}</div></div>`;
      }
      const isLast = idx === session.messages.length - 1;
      return `
        <div class="msg assistant" data-idx="${idx}">
          <div class="avatar">${ICON.star}</div>
          <div class="content-wrap" style="flex:1; min-width:0;">
            <div class="content">${parseMarkdown(m.content)}</div>
            <div class="msg-actions">
              <button data-copy="${idx}" aria-label="Salin">${ICON.copy}</button>
              ${isLast ? `<button data-regen="${idx}" aria-label="Buat ulang">${ICON.refresh}</button>` : ''}
            </div>
          </div>
        </div>`;
    }).join('');

    scrollToBottom();
  }

  function ICON_STAR_LG(){
    return '<svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L14.2 9.8 L22 12 L14.2 14.2 L12 22 L9.8 14.2 L2 12 L9.8 9.8 Z"/></svg>';
  }

  chatInner.addEventListener('click', (e) => {
    const copyBtn = e.target.closest('[data-copy]');
    if(copyBtn){
      const session = getCurrentSession();
      const text = session.messages[+copyBtn.dataset.copy].content;
      navigator.clipboard.writeText(text).then(() => showToast('Disalin ke clipboard'));
      return;
    }
    const regenBtn = e.target.closest('[data-regen]');
    if(regenBtn){ regenerateLast(); }
  });

  function scrollToBottom(){
    requestAnimationFrame(() => { chatScroll.scrollTop = chatScroll.scrollHeight; });
  }

  /* ============ MARKDOWN (lightweight) ============ */
  function escapeHtml(str){
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function parseMarkdown(raw){
    let text = escapeHtml(raw);
    const blocks = [];
    text = text.replace(/```([\s\S]*?)```/g, (_, code) => {
      blocks.push(`<pre><code>${code.trim()}</code></pre>`);
      return `\u0000${blocks.length - 1}\u0000`;
    });
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
    text = text.split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
    text = text.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
    return text;
  }

  /* ============ COMPOSER ============ */
  function autoResize(){
    composerInput.style.height = 'auto';
    composerInput.style.height = Math.min(composerInput.scrollHeight, 200) + 'px';
  }
  function toggleSendState(){
    sendBtn.disabled = composerInput.value.trim().length === 0;
  }
  composerInput.addEventListener('input', () => { autoResize(); toggleSendState(); });
  composerInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });
  sendBtn.addEventListener('click', sendMessage);

  function sendMessage(){
    const text = composerInput.value.trim();
    if(!text) return;

    if(!currentId){
      const s = { id: makeId(), title: text.slice(0,42), messages: [], updatedAt: Date.now() };
      sessions.push(s);
      currentId = s.id;
    }
    const session = getCurrentSession();
    if(session.messages.length === 0) session.title = text.slice(0,42);
    session.messages.push({ role:'user', content:text });
    session.updatedAt = Date.now();
    saveSessions();
    renderSessionList(searchInput.value);
    renderMessages();

    composerInput.value = '';
    autoResize();
    toggleSendState();

    askAI(session);
  }

  function regenerateLast(){
    const session = getCurrentSession();
    if(!session) return;
    const last = session.messages[session.messages.length - 1];
    if(last && last.role === 'assistant') session.messages.pop();
    saveSessions();
    renderMessages();
    askAI(session);
  }

  /* ============ AI CALL ============ =====================================
     Ganti bagian ini untuk sambungkan ke backend/API kamu sendiri
     (mis. Groq API lewat serverless function seperti di Garuda AI).
     Bentuk yang diharapkan dari endpoint: POST { messages } -> { reply }
  ========================================================================= */
    async function askAI(session){
    showTypingIndicator();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: session.messages })
      });
      
      const data = await res.json();
      
      if (!res.ok) {
        throw new Error(data.error || 'Terjadi kesalahan pada server');
      }
      
      finishAIReply(session, data.reply || '(respons kosong)');
    } catch (err) {
      finishAIReply(session, `⚠️ Error: ${err.message || 'Gagal terhubung ke Procyon. Pastikan backend Vercel sudah aktif.'}`);
    }
  }


  function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

  function showTypingIndicator(){
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant typing';
    wrap.id = 'typingIndicator';
    wrap.innerHTML = `
      <div class="avatar">${ICON.star}</div>
      <div class="content">
        <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
      </div>`;
    chatInner.appendChild(wrap);
    scrollToBottom();
  }

  function finishAIReply(session, replyText){
    const indicator = document.getElementById('typingIndicator');
    if(indicator) indicator.remove();
    session.messages.push({ role:'assistant', content: replyText });
    session.updatedAt = Date.now();
    saveSessions();
    renderSessionList(searchInput.value);
    renderMessages();
  }

  /* ============ TOAST ============ */
  let toastTimer;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  /* ============ INIT ============ */
  renderSessionList('');
  renderMessages();
  toggleSendState();
})();
</script>
</body>
</html>
