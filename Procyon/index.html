<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procyon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f6f7;
    --bg-sidebar:#ececef;
    --bg-surface:#ffffff;
    --bg-hover:#e4e4e8;
    --border:#e1e1e5;
    --text:#1c1c1f;
    --text-muted:#6b6b72;
    --text-faint:#9c9ca3;
    --accent:#2c2c30;
    --accent-contrast:#ffffff;
    --danger:#b3432f;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow:0 1px 2px rgba(20,20,25,.04), 0 8px 24px rgba(20,20,25,.06);
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg:#1b1b1e;
    --bg-sidebar:#202024;
    --bg-surface:#28282c;
    --bg-hover:#323236;
    --border:#37373c;
    --text:#f1f1f2;
    --text-muted:#a2a2a8;
    --text-faint:#6f6f76;
    --accent:#f1f1f2;
    --accent-contrast:#1b1b1e;
    --danger:#e08a76;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer;}
  textarea{font-family:inherit;}
  ::selection{background:rgba(140,140,160,.35);}
  .hide{display:none !important;}

  *{scrollbar-width:thin; scrollbar-color: var(--border) transparent;}
  *::-webkit-scrollbar{width:8px; height:8px;}
  *::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
  *::-webkit-scrollbar-track{background:transparent;}

  a:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible{
    outline:2px solid var(--text-muted);
    outline-offset:2px;
  }

  .app{display:flex; height:100vh; width:100vw; position:relative;}

  /* ---------- Star mark ---------- */
  .star{display:inline-block; color:var(--accent);}
  .star svg{display:block;}
  @keyframes starPulse{0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(.78); opacity:.55;}}
  @keyframes starSpin{from{transform:rotate(0deg);} to{transform:rotate(360deg);}}
  .star.thinking svg{animation:starPulse 1.1s ease-in-out infinite;}
  .star.idle-anim svg{animation:starSpin 18s linear infinite;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:264px; flex-shrink:0; background:var(--bg-sidebar);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column; height:100%;
    transition:transform .25s ease; z-index:40;
  }
  .sidebar-header{display:flex; align-items:center; gap:10px; padding:18px 16px 14px 18px;}
  .brand{display:flex; align-items:center; gap:10px; flex:1; min-width:0;}
  .brand-name{font-weight:600; font-size:15px; letter-spacing:.2px;}
  .sidebar-collapse{background:none; border:none; color:var(--text-muted); width:28px; height:28px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center;}
  .sidebar-collapse:hover{background:var(--bg-hover);}

  .new-chat-btn{
    margin:2px 14px 12px 14px; display:flex; align-items:center; gap:8px;
    background:var(--bg-surface); border:1px solid var(--border); color:var(--text);
    padding:9px 12px; border-radius:var(--radius-md); font-size:13.5px; font-weight:500;
    box-shadow:var(--shadow);
  }
  .new-chat-btn:hover{background:var(--bg-hover);}

  .sidebar-search{
    margin:0 14px 10px 14px; display:flex; align-items:center; gap:8px;
    background:transparent; border:1px solid var(--border); border-radius:var(--radius-md); padding:7px 10px;
  }
  .sidebar-search svg{flex-shrink:0; color:var(--text-faint);}
  .sidebar-search input{border:none; background:transparent; outline:none; font-size:13px; color:var(--text); width:100%;}
  .sidebar-search input::placeholder{color:var(--text-faint);}

  .sidebar-label{padding:10px 18px 4px 18px; font-size:11px; font-weight:600; letter-spacing:.4px; color:var(--text-faint); text-transform:uppercase;}
  .session-list{flex:1; overflow-y:auto; padding:0 10px 10px 10px;}
  .session-item{position:relative; display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:var(--radius-sm); font-size:13.5px; color:var(--text); cursor:pointer; white-space:nowrap; overflow:hidden;}
  .session-item span.title{overflow:hidden; text-overflow:ellipsis; flex:1;}
  .session-item .mode-tag{font-size:9.5px; font-weight:700; color:var(--text-faint); border:1px solid var(--border); border-radius:5px; padding:1px 5px; flex-shrink:0;}
  .session-item:hover{background:var(--bg-hover);}
  .session-item.active{background:var(--bg-hover); font-weight:500;}
  .session-delete{display:none; background:none; border:none; color:var(--text-faint); width:22px; height:22px; border-radius:6px; align-items:center; justify-content:center; flex-shrink:0;}
  .session-item:hover .session-delete{display:flex;}
  .session-delete:hover{color:var(--danger); background:rgba(179,67,47,.1);}
  .session-empty{padding:14px 18px; font-size:12.5px; color:var(--text-faint);}

  .sidebar-footer{border-top:1px solid var(--border); padding:10px 14px; display:flex; align-items:center; justify-content:space-between;}
  .icon-btn{background:none; border:none; color:var(--text-muted); width:32px; height:32px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center;}
  .icon-btn:hover{background:var(--bg-hover); color:var(--text);}
  .footer-hint{font-size:11.5px; color:var(--text-faint);}
  .sidebar-backdrop{display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:35;}

  /* ---------- Main ---------- */
  .main{flex:1; display:flex; flex-direction:column; min-width:0; height:100%;}
  .topbar{height:54px; flex-shrink:0; display:flex; align-items:center; gap:10px; padding:0 16px;}
  .hamburger{display:none;}
  .topbar-title{font-size:13.5px; color:var(--text-muted); font-weight:500; display:flex; align-items:center;}
  .topbar-spacer{flex:1;}
  .status-dot{width:6px; height:6px; border-radius:50%; background:#6ea86e; display:inline-block; margin-right:6px;}

  .mode-switch{display:flex; background:var(--bg-hover); border-radius:999px; padding:2px; gap:2px;}
  .mode-switch button{border:none; background:transparent; color:var(--text-muted); font-size:12.5px; font-weight:500; padding:6px 13px; border-radius:999px; display:flex; align-items:center; gap:6px;}
  .mode-switch button.active{background:var(--bg-surface); color:var(--text); box-shadow:var(--shadow);}
  .mode-switch button:hover:not(.active){color:var(--text);}

  /* ---------- Single mode chat ---------- */
  .chat-scroll{flex:1; overflow-y:auto; display:flex; flex-direction:column; align-items:center; min-height:0;}
  .chat-inner{width:100%; max-width:720px; padding:8px 20px 40px 20px;}

  .empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; min-height:calc(100vh - 220px); padding:0 16px;}
  .empty-state .star{margin-bottom:18px;}
  .empty-title{font-size:26px; font-weight:600; letter-spacing:-.3px; margin-bottom:6px;}
  .empty-sub{font-size:14.5px; color:var(--text-muted); margin-bottom:26px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:520px;}
  .chip{background:var(--bg-surface); border:1px solid var(--border); color:var(--text); padding:8px 14px; border-radius:999px; font-size:13px;}
  .chip:hover{background:var(--bg-hover);}

  .msg{margin:18px 0; animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  .msg.user{display:flex; justify-content:flex-end;}
  .msg.user .bubble{background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:10px 16px; max-width:75%; font-size:14.5px; line-height:1.55; white-space:pre-wrap; word-break:break-word;}
  .msg.assistant{display:flex; gap:12px; align-items:flex-start;}
  .msg.assistant .avatar{flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--bg-surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; margin-top:2px;}
  .msg.assistant .avatar svg{width:13px; height:13px;}
  .msg.assistant .content{flex:1; min-width:0; font-size:14.5px; line-height:1.65;}
  .msg.assistant .content p{margin:0 0 10px 0;}
  .msg.assistant .content p:last-child{margin-bottom:0;}
  .msg.assistant .content code{font-family:'JetBrains Mono', monospace; background:var(--bg-hover); padding:1px 5px; border-radius:4px; font-size:.88em;}
  .msg.assistant .content pre{background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 14px; overflow-x:auto; margin:10px 0;}
  .msg.assistant .content pre code{background:none; padding:0; font-size:13px;}
  .msg.assistant .content strong{font-weight:600;}

  .msg-actions{display:flex; gap:2px; margin-top:6px; opacity:0; transition:opacity .15s ease;}
  .msg.assistant:hover .msg-actions{opacity:1;}
  .msg-actions button{background:none; border:none; color:var(--text-faint); width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center;}
  .msg-actions button:hover{background:var(--bg-hover); color:var(--text);}

  .typing .content{display:flex; align-items:center; gap:4px; height:20px;}
  .typing-dot{width:6px; height:6px; border-radius:50%; background:var(--text-faint); animation:typingBounce 1.2s infinite ease-in-out;}
  .typing-dot:nth-child(2){animation-delay:.15s;}
  .typing-dot:nth-child(3){animation-delay:.3s;}
  @keyframes typingBounce{0%,60%,100%{transform:translateY(0); opacity:.5;} 30%{transform:translateY(-4px); opacity:1;}}

  /* ---------- Multi mode canvas ---------- */
  .canvas-viewport{
    flex:1; position:relative; overflow:hidden; min-height:0;
    background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
    background-size: 22px 22px;
    cursor:grab; touch-action:none;
  }
  .canvas-content{position:absolute; top:0; left:0; width:900px; transform-origin:0 0;}
  .canvas-pill{
    position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:6;
    background:var(--bg-surface); border:1px solid var(--border); padding:6px 14px; border-radius:999px;
    font-size:12px; color:var(--text-muted); box-shadow:var(--shadow); pointer-events:none; white-space:nowrap;
  }
  .canvas-note{
    position:absolute; top:48px; left:50%; transform:translateX(-50%); z-index:6;
    font-size:11px; color:var(--text-faint); pointer-events:none; white-space:nowrap;
  }
  .zoom-controls{position:absolute; bottom:16px; right:16px; z-index:6; display:flex; flex-direction:column; background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow); overflow:hidden;}
  .zoom-controls button{width:34px; height:34px; background:none; border:none; color:var(--text); display:flex; align-items:center; justify-content:center;}
  .zoom-controls button:hover{background:var(--bg-hover);}
  .zoom-controls button:not(:last-child){border-bottom:1px solid var(--border);}

  .canvas-empty{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 20px; z-index:2;}
  .canvas-empty .star{margin-bottom:18px;}

  .turn-group{position:relative; display:flex; flex-direction:column; align-items:center; padding:70px 30px 40px 30px;}
  .turn-root{background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:10px 16px; font-size:13.5px; box-shadow:var(--shadow); max-width:380px; min-width:120px;}
  .turn-root-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:3px;}
  .turn-root-label{font-size:10.5px; font-weight:700; letter-spacing:.4px; color:var(--text-faint); display:flex; align-items:center; gap:5px;}
  .turn-root-text{color:var(--text); word-break:break-word;}
  .turn-regen-all{opacity:0; background:none; border:none; color:var(--text-faint); width:20px; height:20px; border-radius:6px; display:flex; align-items:center; justify-content:center; transition:opacity .15s ease; flex-shrink:0;}
  .turn-root:hover .turn-regen-all{opacity:1;}
  .turn-regen-all:hover{background:var(--bg-hover); color:var(--text);}

  .connector-svg{position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; overflow:visible;}
  .connector-svg path{stroke:var(--text-faint); stroke-width:1.4; stroke-dasharray:3 4; fill:none;}

  .branch-row{position:relative; display:flex; gap:16px; margin-top:56px;}
  .branch-card{width:210px; background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow); padding:12px 14px; font-size:12.5px; display:flex; flex-direction:column; gap:8px;}
  .branch-card-head{display:flex; align-items:center; gap:6px;}
  .branch-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .branch-name{font-weight:600; font-size:12.5px; flex:1;}
  .branch-status{font-size:9.5px; font-weight:700; letter-spacing:.3px; padding:2px 7px; border-radius:999px; white-space:nowrap;}
  .branch-status.pending{background:var(--bg-hover); color:var(--text-faint);}
  .branch-status.done{background:rgba(110,168,110,.16); color:#4c8a52;}
  [data-theme="dark"] .branch-status.done{color:#8fcf93;}
  .branch-body{color:var(--text); line-height:1.5;}
  .branch-body p{margin:0 0 6px 0;}
  .branch-body p:last-child{margin:0;}
  .branch-body code{font-family:'JetBrains Mono', monospace; background:var(--bg-hover); padding:1px 4px; border-radius:4px; font-size:.88em;}
  .branch-thinking{display:flex; align-items:center; gap:4px; height:14px;}
  .branch-actions{display:flex; align-items:center; gap:2px; border-top:1px solid var(--border); padding-top:8px;}
  .branch-actions button{background:none; border:none; color:var(--text-faint); width:24px; height:24px; border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .branch-actions button:hover{background:var(--bg-hover); color:var(--text);}
  .branch-actions .use-reply{width:auto; padding:0 8px; font-size:11px; font-weight:500; gap:4px; margin-left:auto;}

  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--accent); color:var(--accent-contrast); padding:9px 16px; border-radius:999px; font-size:13px; font-weight:500; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:100; box-shadow:var(--shadow);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .composer-wrap{display:flex; justify-content:center; padding:0 20px 18px 20px; flex-shrink:0;}
  .composer{width:100%; max-width:720px; background:var(--bg-surface); border:1px solid var(--border); border-radius:22px; box-shadow:var(--shadow); padding:10px 10px 10px 18px; display:flex; align-items:flex-end; gap:8px;}
  .composer textarea{flex:1; border:none; outline:none; background:transparent; resize:none; color:var(--text); font-size:14.5px; line-height:1.5; max-height:200px; padding:6px 0;}
  .composer textarea::placeholder{color:var(--text-faint);}
  .send-btn{flex-shrink:0; width:34px; height:34px; border-radius:50%; background:var(--accent); color:var(--accent-contrast); border:none; display:flex; align-items:center; justify-content:center; transition:opacity .15s ease, transform .1s ease;}
  .send-btn:disabled{opacity:.35; cursor:default;}
  .send-btn:not(:disabled):hover{transform:scale(1.05);}
  .composer-hint{text-align:center; font-size:11.5px; color:var(--text-faint); margin-top:9px;}

  @media (max-width:820px){
    .sidebar{position:fixed; top:0; left:0; bottom:0; transform:translateX(-100%); width:280px;}
    .sidebar.open{transform:translateX(0);}
    .sidebar-backdrop.show{display:block;}
    .hamburger{display:flex; background:none; border:none; color:var(--text); width:32px; height:32px; border-radius:var(--radius-sm); align-items:center; justify-content:center;}
    .hamburger:hover{background:var(--bg-hover);}
    .msg.user .bubble{max-width:88%;}
    .mode-switch button span.label{display:none;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

<div class="app">

  <div class="sidebar-backdrop" id="backdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <span class="star idle-anim" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L14.2 9.8 L22 12 L14.2 14.2 L12 22 L9.8 14.2 L2 12 L9.8 9.8 Z"/></svg>
        </span>
        <span class="brand-name">Procyon</span>
      </div>
      <button class="sidebar-collapse hamburger" id="closeSidebar" aria-label="Tutup sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Chat baru
    </button>

    <div class="sidebar-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Cari percakapan...">
    </div>

    <div class="sidebar-label">Riwayat</div>
    <div class="session-list" id="sessionList"></div>

    <div class="sidebar-footer">
      <span class="footer-hint">Tema</span>
      <button class="icon-btn" id="themeToggle" aria-label="Ganti tema"></button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="openSidebar" aria-label="Buka sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="topbar-title"><span class="status-dot"></span>Procyon</span>
      <div class="topbar-spacer"></div>
      <div class="mode-switch" id="modeSwitch">
        <button data-mode="single" class="active" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.4 8.4 8.3 8.3 0 0 1-3.8-.9L3 21l1.9-5.8a8.3 8.3 0 0 1-.9-3.7A8.4 8.4 0 0 1 12.5 3h.1a8.4 8.4 0 0 1 8.4 8.4Z"/></svg>
          <span class="label">Single</span>
        </button>
        <button data-mode="multi" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>
          <span class="label">Multi</span>
        </button>
      </div>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner"></div>
    </div>

    <div class="canvas-viewport hide" id="canvasViewport">
      <div class="canvas-pill" id="canvasPill" style="display:none;"></div>
      <div class="canvas-note" id="canvasNote" style="display:none;">Balasan masih simulasi — sambungkan API di fetchPersonaReply()</div>
      <div class="canvas-content" id="canvasContent"></div>
      <div class="canvas-empty" id="canvasEmpty">
        <span class="star idle-anim">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L14.2 9.8 L22 12 L14.2 14.2 L12 22 L9.8 14.2 L2 12 L9.8 9.8 Z"/></svg>
        </span>
        <div class="empty-title" style="font-size:22px;">Mode Multi-AI</div>
        <div class="empty-sub">Tanya satu hal, dapat 3 sudut pandang sekaligus.</div>
        <div class="chip-row" id="canvasChipRow"></div>
      </div>
      <div class="zoom-controls">
        <button id="zoomInBtn" aria-label="Perbesar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="zoomOutBtn" aria-label="Perkecil"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button id="zoomResetBtn" aria-label="Reset tampilan"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
      </div>
    </div>

    <div class="composer-wrap">
      <div style="width:100%; max-width:720px;">
        <div class="composer">
          <textarea id="composerInput" rows="1" placeholder="Tanyakan apa saja ke Procyon..."></textarea>
          <button class="send-btn" id="sendBtn" disabled aria-label="Kirim">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <div class="composer-hint">Procyon bisa saja membuat kesalahan. Periksa info penting.</div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ============ ICONS ============ */
  const ICON = {
    star: '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L14.2 9.8 L22 12 L14.2 14.2 L12 22 L9.8 14.2 L2 12 L9.8 9.8 Z"/></svg>',
    copy: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
    check: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    refresh: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6M3 22v-6h6M3.5 8a8.5 8.5 0 0 1 14.6-4.2M20.5 16a8.5 8.5 0 0 1-14.6 4.2"/></svg>',
    trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>',
    sun: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>'
  };

  const PROMPT_CHIPS = [
    "Jelaskan sebuah konsep ke aku",
    "Bantu aku brainstorming ide",
    "Ringkas teks yang panjang",
    "Bantu aku ngoding sesuatu"
  ];

  /* Tiga "kepribadian" yang menjawab bareng di mode Multi */
  const PERSONAS = [
    { id:'nova',  name:'Nova',  color:'#4b9fd6', style:'cepat & ringkas',   delay:[500,1000] },
    { id:'lyra',  name:'Lyra',  color:'#9163d1', style:'kreatif & eksploratif', delay:[1200,1900] },
    { id:'orion', name:'Orion', color:'#4d9a63', style:'detail & analitis', delay:[1700,2500] }
  ];

  /* ============ STATE ============ */
  let sessions = loadSessions();
  let currentId = localStorage.getItem('procyon_current') || (sessions[0] && sessions[0].id) || null;
  let currentMode = 'single';
  let canvasViewState = {};
  let canvasState = { x:20, y:40, scale:1 };

  function loadSessions(){
    let raw = [];
    try{ raw = JSON.parse(localStorage.getItem('procyon_sessions')) || []; }
    catch(e){ raw = []; }
    return raw.map(s => Object.assign({ multiTurns:[], mode:'single' }, s));
  }
  function saveSessions(){
    localStorage.setItem('procyon_sessions', JSON.stringify(sessions));
    if(currentId) localStorage.setItem('procyon_current', currentId);
  }
  function getCurrentSession(){ return sessions.find(s => s.id === currentId) || null; }
  function makeId(){ return 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
  function makeSession(){ return { id: makeId(), title:'Chat baru', messages:[], multiTurns:[], mode:'single', updatedAt:Date.now() }; }
  function ensureSession(){
    if(!currentId){
      const s = makeSession();
      s.mode = currentMode;
      sessions.push(s);
      currentId = s.id;
    }
    return getCurrentSession();
  }
  function setTitleIfNeeded(session, text){
    if(!session.title || session.title === 'Chat baru') session.title = text.slice(0,42);
  }
  function wait(ms){ return new Promise(r => setTimeout(r, ms)); }
  function escapeHtml(str){
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function parseMarkdown(raw){
    let text = escapeHtml(raw);
    const blocks = [];
    text = text.replace(/```([\s\S]*?)```/g, (_, code) => {
      blocks.push(`<pre><code>${code.trim()}</code></pre>`);
      return `\u0000${blocks.length - 1}\u0000`;
    });
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
    text = text.split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
    text = text.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
    return text;
  }

  /* ============ DOM REFS ============ */
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('backdrop');
  const sessionListEl = document.getElementById('sessionList');
  const chatScrollEl = document.getElementById('chatScroll');
  const chatInner = document.getElementById('chatInner');
  const composerInput = document.getElementById('composerInput');
  const sendBtn = document.getElementById('sendBtn');
  const searchInput = document.getElementById('searchInput');
  const toastEl = document.getElementById('toast');
  const themeToggle = document.getElementById('themeToggle');
  const modeSwitchEl = document.getElementById('modeSwitch');
  const canvasViewportEl = document.getElementById('canvasViewport');
  const canvasContentEl = document.getElementById('canvasContent');
  const canvasEmptyEl = document.getElementById('canvasEmpty');
  const canvasChipRowEl = document.getElementById('canvasChipRow');
  const canvasPillEl = document.getElementById('canvasPill');
  const canvasNoteEl = document.getElementById('canvasNote');

  canvasChipRowEl.innerHTML = PROMPT_CHIPS.map(c => `<button class="chip" data-chip="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');

  /* ============ THEME ============ */
  function applyTheme(t){
    document.documentElement.dataset.theme = t;
    themeToggle.innerHTML = t === 'dark' ? ICON.sun : ICON.moon;
    localStorage.setItem('procyon_theme', t);
  }
  applyTheme(localStorage.getItem('procyon_theme') || 'light');
  themeToggle.addEventListener('click', () => {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });

  /* ============ SIDEBAR (mobile) ============ */
  document.getElementById('openSidebar').addEventListener('click', () => {
    sidebar.classList.add('open'); backdrop.classList.add('show');
  });
  document.getElementById('closeSidebar').addEventListener('click', closeMobileSidebar);
  backdrop.addEventListener('click', closeMobileSidebar);
  function closeMobileSidebar(){ sidebar.classList.remove('open'); backdrop.classList.remove('show'); }

  /* ============ SESSION LIST ============ */
  function renderSessionList(filter){
    const q = (filter||'').trim().toLowerCase();
    const filtered = sessions.slice().sort((a,b) => b.updatedAt - a.updatedAt)
      .filter(s => !q || s.title.toLowerCase().includes(q));

    if(filtered.length === 0){
      sessionListEl.innerHTML = '<div class="session-empty">Belum ada percakapan.</div>';
      return;
    }
    sessionListEl.innerHTML = filtered.map(s => `
      <div class="session-item ${s.id === currentId ? 'active' : ''}" data-id="${s.id}">
        <span class="title">${escapeHtml(s.title)}</span>
        ${s.mode === 'multi' ? '<span class="mode-tag">MULTI</span>' : ''}
        <button class="session-delete" data-del="${s.id}" aria-label="Hapus percakapan">${ICON.trash}</button>
      </div>
    `).join('');
  }

  sessionListEl.addEventListener('click', (e) => {
    const delBtn = e.target.closest('[data-del]');
    if(delBtn){ e.stopPropagation(); deleteSession(delBtn.dataset.del); return; }
    const item = e.target.closest('.session-item');
    if(item){ switchSession(item.dataset.id); closeMobileSidebar(); }
  });
  searchInput.addEventListener('input', () => renderSessionList(searchInput.value));

  function switchSession(id){
    currentId = id;
    const s = getCurrentSession();
    currentMode = (s && s.mode) || 'single';
    saveSessions();
    renderSessionList(searchInput.value);
    renderActiveView();
  }
  function deleteSession(id){
    sessions = sessions.filter(s => s.id !== id);
    if(currentId === id) currentId = sessions[0] ? sessions[0].id : null;
    const s = getCurrentSession();
    currentMode = (s && s.mode) || 'single';
    saveSessions();
    renderSessionList(searchInput.value);
    renderActiveView();
    showToast('Percakapan dihapus');
  }
  document.getElementById('newChatBtn').addEventListener('click', () => {
    currentId = null;
    currentMode = 'single';
    saveSessions();
    renderSessionList(searchInput.value);
    renderActiveView();
    composerInput.focus();
    closeMobileSidebar();
  });

  /* ============ MODE SWITCH ============ */
  function syncModeButtons(){
    modeSwitchEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.mode === currentMode));
    composerInput.placeholder = currentMode === 'multi'
      ? 'Tanyakan satu hal, 3 AI akan menjawab...'
      : 'Tanyakan apa saja ke Procyon...';
  }
  function setMode(m){
    currentMode = m;
    const s = getCurrentSession();
    if(s){ s.mode = m; saveSessions(); renderSessionList(searchInput.value); }
    renderActiveView();
  }
  modeSwitchEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if(btn) setMode(btn.dataset.mode);
  });

  function renderActiveView(){
    syncModeButtons();
    if(currentMode === 'multi'){
      chatScrollEl.classList.add('hide');
      canvasViewportEl.classList.remove('hide');
      renderCanvas();
    } else {
      canvasViewportEl.classList.add('hide');
      chatScrollEl.classList.remove('hide');
      renderMessages();
    }
  }

  /* ============ SINGLE MODE ============ */
  function bindChips(container){
    container.querySelectorAll('[data-chip]').forEach(btn => {
      btn.addEventListener('click', () => {
        composerInput.value = btn.dataset.chip;
        autoResize(); toggleSendState(); composerInput.focus();
      });
    });
  }

  function renderMessages(){
    const session = getCurrentSession();
    if(!session || session.messages.length === 0){
      chatInner.innerHTML = `
        <div class="empty-state">
          <span class="star idle-anim">${ICON_STAR_LG()}</span>
          <div class="empty-title">Halo, aku Procyon</div>
          <div class="empty-sub">Ada yang bisa kubantu hari ini?</div>
          <div class="chip-row">${PROMPT_CHIPS.map(c => `<button class="chip" data-chip="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}</div>
        </div>`;
      bindChips(chatInner);
      return;
    }
    chatInner.innerHTML = session.messages.map((m, idx) => {
      if(m.role === 'user') return `<div class="msg user"><div class="bubble">${escapeHtml(m.content)}</div></div>`;
      const isLast = idx === session.messages.length - 1;
      return `
        <div class="msg assistant" data-idx="${idx}">
          <div class="avatar">${ICON.star}</div>
          <div class="content-wrap" style="flex:1; min-width:0;">
            <div class="content">${parseMarkdown(m.content)}</div>
            <div class="msg-actions">
              <button data-copy="${idx}" aria-label="Salin">${ICON.copy}</button>
              ${isLast ? `<button data-regen="${idx}" aria-label="Buat ulang">${ICON.refresh}</button>` : ''}
            </div>
          </div>
        </div>`;
    }).join('');
    scrollToBottom();
  }
  function ICON_STAR_LG(){
    return '<svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L14.2 9.8 L22 12 L14.2 14.2 L12 22 L9.8 14.2 L2 12 L9.8 9.8 Z"/></svg>';
  }
  chatInner.addEventListener('click', (e) => {
    const copyBtn = e.target.closest('[data-copy]');
    if(copyBtn){
      const session = getCurrentSession();
      navigator.clipboard.writeText(session.messages[+copyBtn.dataset.copy].content).then(() => showToast('Disalin ke clipboard'));
      return;
    }
    const regenBtn = e.target.closest('[data-regen]');
    if(regenBtn) regenerateLast();
  });
  function scrollToBottom(){ requestAnimationFrame(() => { chatScrollEl.scrollTop = chatScrollEl.scrollHeight; }); }

  function sendSingleTurn(text){
    const session = ensureSession();
    setTitleIfNeeded(session, text);
    session.messages.push({ role:'user', content:text });
    session.updatedAt = Date.now();
    saveSessions();
    renderSessionList(searchInput.value);
    renderMessages();
    askAI(session);
  }
  function regenerateLast(){
    const session = getCurrentSession();
    if(!session) return;
    const last = session.messages[session.messages.length - 1];
    if(last && last.role === 'assistant') session.messages.pop();
    saveSessions();
    renderMessages();
    askAI(session);
  }
  async function askAI(session){
    showTypingIndicator();
    try{
      const res = await fetch('/api/chat', {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ messages: session.messages })
      });
      if(!res.ok) throw new Error('bad response');
      const data = await res.json();
      finishAIReply(session, data.reply || '(respons kosong)');
    }catch(err){
      await wait(700 + Math.random()*700);
      const lastUser = [...session.messages].reverse().find(m => m.role === 'user');
      finishAIReply(session, simulateReply(lastUser ? lastUser.content : ''));
    }
  }
  function simulateReply(userText){
    return `Ini masih **respons simulasi** ya — belum tersambung ke API asli.\n\nKamu bilang: *${userText}*\n\nSambungkan endpoint \`/api/chat\` di \`askAI()\` untuk balasan sungguhan.`;
  }
  function showTypingIndicator(){
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant typing';
    wrap.id = 'typingIndicator';
    wrap.innerHTML = `<div class="avatar">${ICON.star}</div><div class="content"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
    chatInner.appendChild(wrap);
    scrollToBottom();
  }
  function finishAIReply(session, replyText){
    const indicator = document.getElementById('typingIndicator');
    if(indicator) indicator.remove();
    session.messages.push({ role:'assistant', content: replyText });
    session.updatedAt = Date.now();
    saveSessions();
    renderSessionList(searchInput.value);
    renderMessages();
  }

  /* ============ MULTI MODE (canvas) ============ */
  bindChips(canvasEmptyEl);

  function getCanvasState(sessionId){
    if(!canvasViewState[sessionId]){
      const vpRect = canvasViewportEl.getBoundingClientRect();
      const w = vpRect.width || 800;
      const fitScale = Math.min(1, Math.max(0.45, (w - 40) / 900));
      canvasViewState[sessionId] = { x: Math.max(16, (w - 900*fitScale)/2), y: 20, scale: fitScale };
    }
    return canvasViewState[sessionId];
  }
  function applyCanvasTransform(){
    canvasContentEl.style.transform = `translate(${canvasState.x}px, ${canvasState.y}px) scale(${canvasState.scale})`;
  }

  function renderCanvas(){
    const session = getCurrentSession();
    if(!session || session.multiTurns.length === 0){
      canvasContentEl.innerHTML = '';
      canvasEmptyEl.classList.remove('hide');
      canvasPillEl.style.display = 'none';
      canvasNoteEl.style.display = 'none';
      return;
    }
    canvasEmptyEl.classList.add('hide');
    canvasState = getCanvasState(session.id);

    canvasContentEl.innerHTML = session.multiTurns.map((turn, ti) => buildTurnGroupHTML(turn, ti)).join('');
    updatePill(session);
    applyCanvasTransform();
    requestAnimationFrame(drawAllConnectors);
  }

  function buildTurnGroupHTML(turn, ti){
    const branches = turn.branches.map((b, bi) => {
      const p = PERSONAS.find(p => p.id === b.persona);
      const statusClass = b.status === 'done' ? 'done' : 'pending';
      const statusLabel = b.status === 'done' ? 'SELESAI' : 'MIKIR...';
      const bodyHtml = b.status === 'done'
        ? parseMarkdown(b.content)
        : `<div class="branch-thinking"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
      return `
        <div class="branch-card" data-turn="${ti}" data-branch="${bi}">
          <div class="branch-card-head">
            <span class="branch-dot" style="background:${p.color}"></span>
            <span class="branch-name">${p.name}</span>
            <span class="branch-status ${statusClass}">${statusLabel}</span>
          </div>
          <div class="branch-body">${bodyHtml}</div>
          ${b.status === 'done' ? `
          <div class="branch-actions">
            <button data-mcopy="${ti}:${bi}" aria-label="Salin">${ICON.copy}</button>
            <button data-mregen="${ti}:${bi}" aria-label="Buat ulang">${ICON.refresh}</button>
            <button class="use-reply" data-use="${ti}:${bi}">${ICON.check} Pakai ini</button>
          </div>` : ''}
        </div>`;
    }).join('');

    return `
      <div class="turn-group" data-turn-group="${ti}">
        <div class="turn-root">
          <div class="turn-root-top">
            <span class="turn-root-label">${ICON.star} KAMU</span>
            <button class="turn-regen-all" data-regen-turn="${ti}" aria-label="Ulangi ke semua AI">${ICON.refresh}</button>
          </div>
          <div class="turn-root-text">${escapeHtml(turn.userText)}</div>
        </div>
        <svg class="connector-svg"></svg>
        <div class="branch-row">${branches}</div>
      </div>`;
  }

  function drawAllConnectors(){
    canvasContentEl.querySelectorAll('.turn-group').forEach(drawConnector);
  }
  function drawConnector(groupEl){
    const root = groupEl.querySelector('.turn-root');
    const svg = groupEl.querySelector('.connector-svg');
    const row = groupEl.querySelector('.branch-row');
    const cards = groupEl.querySelectorAll('.branch-card');
    if(!root || !svg || !row) return;
    const rootCenterX = root.offsetLeft + root.offsetWidth/2;
    const rootBottomY = root.offsetTop + root.offsetHeight;
    let paths = '';
    cards.forEach(card => {
      const cx = row.offsetLeft + card.offsetLeft + card.offsetWidth/2;
      const cy = row.offsetTop + card.offsetTop;
      const midY = (rootBottomY + cy) / 2;
      paths += `<path d="M${rootCenterX},${rootBottomY} C${rootCenterX},${midY} ${cx},${midY} ${cx},${cy}"/>`;
    });
    svg.innerHTML = paths;
  }

  function updatePill(session){
    if(!session.multiTurns.length){ canvasPillEl.style.display = 'none'; canvasNoteEl.style.display = 'none'; return; }
    canvasPillEl.style.display = 'inline-flex';
    canvasNoteEl.style.display = 'block';
    const last = session.multiTurns[session.multiTurns.length - 1];
    const done = last.branches.filter(b => b.status === 'done').length;
    canvasPillEl.textContent = `${done}/${last.branches.length} model selesai · geser / cubit zoom`;
  }

  function focusLatestTurn(){
    requestAnimationFrame(() => {
      const groups = canvasContentEl.querySelectorAll('.turn-group');
      const last = groups[groups.length - 1];
      if(!last) return;
      canvasState.y = 20 - last.offsetTop * canvasState.scale;
      applyCanvasTransform();
    });
  }

  function personaFallback(id, userText){
    const short = userText.length > 60 ? userText.slice(0,60) + '...' : userText;
    const templates = {
      nova: `Singkatnya: aku fokus ke jawaban intinya dulu ya. Soal "${short}" — itu bisa didekati langsung tanpa muter-muter.`,
      lyra: `Menarik. Coba bayangin "${short}" itu kayak bintang yang lagi cari orbitnya sendiri — ada beberapa arah eksplorasi yang bisa dicoba, nggak cuma satu jawaban baku.`,
      orion: `Aku uraikan bertahap ya:\n\n1. Pahami inti pertanyaan\n2. Kumpulkan konteks yang relevan\n3. Susun jawaban terstruktur\n\nUntuk "${short}", itu pendekatan yang aku pakai.`
    };
    return templates[id] || `Balasan untuk: ${userText}`;
  }

  async function fetchPersonaReply(session, turn, ti, bi){
    const branch = turn.branches[bi];
    const persona = PERSONAS.find(p => p.id === branch.persona);
    try{
      const res = await fetch('/api/chat', {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ persona: persona.id, messages: [{ role:'user', content: turn.userText }] })
      });
      if(!res.ok) throw new Error('bad response');
      const data = await res.json();
      completeBranch(session.id, ti, bi, data.reply || '(respons kosong)');
    }catch(err){
      await wait(persona.delay[0] + Math.random() * (persona.delay[1] - persona.delay[0]));
      completeBranch(session.id, ti, bi, personaFallback(persona.id, turn.userText));
    }
  }
  function completeBranch(sessionId, ti, bi, text){
    const session = sessions.find(s => s.id === sessionId);
    if(!session) return;
    const turn = session.multiTurns[ti]; if(!turn) return;
    const branch = turn.branches[bi]; if(!branch) return;
    branch.status = 'done';
    branch.content = text;
    session.updatedAt = Date.now();
    saveSessions();
    if(getCurrentSession() && getCurrentSession().id === sessionId && currentMode === 'multi'){
      const scrollBefore = { x: canvasState.x, y: canvasState.y, scale: canvasState.scale };
      renderCanvas();
      canvasState.x = scrollBefore.x; canvasState.y = scrollBefore.y; canvasState.scale = scrollBefore.scale;
      applyCanvasTransform();
    }
    renderSessionList(searchInput.value);
  }

  function sendMultiTurn(text){
    const session = ensureSession();
    setTitleIfNeeded(session, text);
    const turn = { userText:text, branches: PERSONAS.map(p => ({ persona:p.id, status:'pending', content:'' })) };
    session.multiTurns.push(turn);
    session.updatedAt = Date.now();
    saveSessions();
    renderSessionList(searchInput.value);
    renderCanvas();
    focusLatestTurn();
    const ti = session.multiTurns.length - 1;
    turn.branches.forEach((b, bi) => fetchPersonaReply(session, turn, ti, bi));
  }

  function regenerateTurn(ti){
    const session = getCurrentSession();
    const turn = session && session.multiTurns[ti];
    if(!turn) return;
    turn.branches.forEach(b => { b.status = 'pending'; b.content = ''; });
    saveSessions();
    renderCanvas();
    turn.branches.forEach((b, bi) => fetchPersonaReply(session, turn, ti, bi));
  }
  function regenerateBranch(ti, bi){
    const session = getCurrentSession();
    const turn = session && session.multiTurns[ti];
    if(!turn) return;
    const branch = turn.branches[bi];
    branch.status = 'pending'; branch.content = '';
    saveSessions();
    renderCanvas();
    fetchPersonaReply(session, turn, ti, bi);
  }
  function useAsReply(ti, bi){
    const session = getCurrentSession();
    const turn = session && session.multiTurns[ti];
    if(!turn) return;
    const branch = turn.branches[bi];
    if(!branch || branch.status !== 'done') return;
    const persona = PERSONAS.find(p => p.id === branch.persona);
    session.messages.push({ role:'user', content: turn.userText });
    session.messages.push({ role:'assistant', content: branch.content });
    session.updatedAt = Date.now();
    saveSessions();
    setMode('single');
    showToast(`Balasan ${persona.name} dipakai di Single`);
  }

  canvasContentEl.addEventListener('click', (e) => {
    const useBtn = e.target.closest('[data-use]');
    if(useBtn){ const [ti,bi] = useBtn.dataset.use.split(':').map(Number); useAsReply(ti,bi); return; }
    const copyBtn = e.target.closest('[data-mcopy]');
    if(copyBtn){
      const [ti,bi] = copyBtn.dataset.mcopy.split(':').map(Number);
      const session = getCurrentSession();
      navigator.clipboard.writeText(session.multiTurns[ti].branches[bi].content).then(() => showToast('Disalin ke clipboard'));
      return;
    }
    const regenBtn = e.target.closest('[data-mregen]');
    if(regenBtn){ const [ti,bi] = regenBtn.dataset.mregen.split(':').map(Number); regenerateBranch(ti,bi); return; }
    const regenTurnBtn = e.target.closest('[data-regen-turn]');
    if(regenTurnBtn){ regenerateTurn(+regenTurnBtn.dataset.regenTurn); }
  });

  /* ---- pan (drag) ---- */
  let panning = false, panStart = {x:0,y:0}, originStart = {x:0,y:0};
  canvasViewportEl.addEventListener('pointerdown', (e) => {
    if(e.target.closest('button')) return;
    panning = true;
    panStart = { x:e.clientX, y:e.clientY };
    originStart = { x:canvasState.x, y:canvasState.y };
    canvasViewportEl.setPointerCapture(e.pointerId);
    canvasViewportEl.style.cursor = 'grabbing';
  });
  canvasViewportEl.addEventListener('pointermove', (e) => {
    if(!panning) return;
    canvasState.x = originStart.x + (e.clientX - panStart.x);
    canvasState.y = originStart.y + (e.clientY - panStart.y);
    applyCanvasTransform();
  });
  function endPan(){ panning = false; canvasViewportEl.style.cursor = 'grab'; }
  canvasViewportEl.addEventListener('pointerup', endPan);
  canvasViewportEl.addEventListener('pointerleave', endPan);
  canvasViewportEl.addEventListener('pointercancel', endPan);

  /* ---- zoom (wheel + pinch + buttons) ---- */
  function zoomAt(clientX, clientY, delta){
    const rect = canvasViewportEl.getBoundingClientRect();
    const px = clientX - rect.left, py = clientY - rect.top;
    const prevScale = canvasState.scale;
    const newScale = Math.min(1.6, Math.max(0.35, prevScale + delta));
    canvasState.x = px - (px - canvasState.x) * (newScale / prevScale);
    canvasState.y = py - (py - canvasState.y) * (newScale / prevScale);
    canvasState.scale = newScale;
    applyCanvasTransform();
  }
  canvasViewportEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, -e.deltaY * 0.0015);
  }, { passive:false });

  let activeTouches = new Map();
  let lastPinchDist = null;
  canvasViewportEl.addEventListener('touchstart', (e) => {
    for(const t of e.changedTouches) activeTouches.set(t.identifier, t);
    if(activeTouches.size >= 2){ panning = false; lastPinchDist = null; }
  }, { passive:true });
  canvasViewportEl.addEventListener('touchmove', (e) => {
    if(e.touches.length >= 2){
      e.preventDefault();
      const t0 = e.touches[0], t1 = e.touches[1];
      const dist = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
      const cx = (t0.clientX + t1.clientX) / 2, cy = (t0.clientY + t1.clientY) / 2;
      if(lastPinchDist != null) zoomAt(cx, cy, (dist - lastPinchDist) * 0.004);
      lastPinchDist = dist;
    }
  }, { passive:false });
  canvasViewportEl.addEventListener('touchend', (e) => {
    for(const t of e.changedTouches) activeTouches.delete(t.identifier);
    if(activeTouches.size < 2) lastPinchDist = null;
  });

  document.getElementById('zoomInBtn').addEventListener('click', () => {
    const r = canvasViewportEl.getBoundingClientRect();
    zoomAt(r.left + r.width/2, r.top + r.height/2, 0.18);
  });
  document.getElementById('zoomOutBtn').addEventListener('click', () => {
    const r = canvasViewportEl.getBoundingClientRect();
    zoomAt(r.left + r.width/2, r.top + r.height/2, -0.18);
  });
  document.getElementById('zoomResetBtn').addEventListener('click', () => {
    const r = canvasViewportEl.getBoundingClientRect();
    const w = r.width || 800;
    const fitScale = Math.min(1, Math.max(0.45, (w - 40) / 900));
    canvasState.x = Math.max(16, (w - 900*fitScale)/2);
    canvasState.y = 20;
    canvasState.scale = fitScale;
    applyCanvasTransform();
  });

  /* ============ COMPOSER ============ */
  function autoResize(){
    composerInput.style.height = 'auto';
    composerInput.style.height = Math.min(composerInput.scrollHeight, 200) + 'px';
  }
  function toggleSendState(){ sendBtn.disabled = composerInput.value.trim().length === 0; }
  composerInput.addEventListener('input', () => { autoResize(); toggleSendState(); });
  composerInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  });
  sendBtn.addEventListener('click', sendMessage);

  function sendMessage(){
    const text = composerInput.value.trim();
    if(!text) return;
    composerInput.value = '';
    autoResize();
    toggleSendState();
    if(currentMode === 'multi') sendMultiTurn(text);
    else sendSingleTurn(text);
  }

  /* ============ TOAST ============ */
  let toastTimer;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  /* ============ INIT ============ */
  const initSession = getCurrentSession();
  currentMode = (initSession && initSession.mode) || 'single';
  renderSessionList('');
  renderActiveView();
  toggleSendState();
})();
</script>
</body>
</html>
